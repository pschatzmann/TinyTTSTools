sentence=Complete header-only Text-to-Speech library for microcontrollers with optional ML support
paragraph=A comprehensive header-only TTS library with a curated phoneme dictionary, formant synthesis, and an optional dependency-free neural G2P fallback (no TensorFlow Lite required). Features real-time synthesis, Arduino Print compatibility, and optimized memory usage. Supports ESP32, Arduino, STM32, and other microcontrollers. Simply include TinyTTSTools.h - no compilation required!
